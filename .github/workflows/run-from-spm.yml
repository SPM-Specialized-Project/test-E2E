name: Run SPM E2E

run-name: SPM E2E ${{ github.event.client_payload.correlation_id }}

on:
  repository_dispatch:
    types:
      - spm-staging-e2e

permissions:
  contents: read

concurrency:
  group: test-e2e-local
  cancel-in-progress: false

jobs:
  e2e:
    name: Browser E2E
    runs-on: [self-hosted, linux, x64, test-e2e-local]
    timeout-minutes: 30
    env:
      BASE_URL: http://127.0.0.1:3010
      API_BASE_URL: http://127.0.0.1:4010
      STAGING_FRONTEND_PORT: 3010
      STAGING_BACKEND_PORT: 4010
      CI: true
    steps:
      - name: Checkout E2E tests
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout SPM application under test
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.app_repository }}
          ref: ${{ github.event.client_payload.app_sha }}
          path: app
          token: ${{ secrets.SPM_CHECKOUT_TOKEN || github.token }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm ci
        working-directory: app/frontend

      - name: Build application frontend
        run: npm run build
        working-directory: app/frontend

      - name: Install E2E dependencies and browser
        run: |
          npm ci
          npx playwright install chromium

      - name: Start isolated SPM application
        shell: bash
        run: |
          set -euo pipefail

          data_dir="$RUNNER_TEMP/spm-e2e-data-$GITHUB_RUN_ID"
          backend_log="$RUNNER_TEMP/spm-backend-$GITHUB_RUN_ID.log"
          frontend_log="$RUNNER_TEMP/spm-frontend-$GITHUB_RUN_ID.log"
          mkdir -p "$data_dir"

          setsid env \
            BACKEND_PORT="$STAGING_BACKEND_PORT" \
            BACKEND_DATA_DIRECTORY="$data_dir" \
            npm --prefix app/backend run start >"$backend_log" 2>&1 &
          backend_pid=$!

          setsid env \
            VITE_FRONTEND_PORT="$STAGING_FRONTEND_PORT" \
            VITE_BACKEND_PROXY_TARGET="$API_BASE_URL" \
            npm --prefix app/frontend run preview -- --host 127.0.0.1 --port "$STAGING_FRONTEND_PORT" --strictPort >"$frontend_log" 2>&1 &
          frontend_pid=$!

          cleanup() {
            kill -- -"$frontend_pid" -"$backend_pid" 2>/dev/null || true
            wait "$frontend_pid" "$backend_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          wait_for_url() {
            local url="$1"
            for _ in $(seq 1 60); do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                return 0
              fi
              sleep 1
            done

            echo "Timed out waiting for $url"
            cat "$backend_log" || true
            cat "$frontend_log" || true
            return 1
          }

          wait_for_url "$API_BASE_URL/api/health"
          wait_for_url "$BASE_URL/login"
          npm test

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spm-e2e-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            playwright-report
            test-results
            ${{ runner.temp }}/spm-backend-${{ github.run_id }}.log
            ${{ runner.temp }}/spm-frontend-${{ github.run_id }}.log
