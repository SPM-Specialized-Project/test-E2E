name: Run SPM E2E

run-name: SPM E2E ${{ github.event.client_payload.correlation_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public staging URL to test, for example https://example.trycloudflare.com
        required: true
        type: string
      app_ref:
        description: SPM application ref for the isolated backend log check
        default: staging
        required: true
        type: string
  repository_dispatch:
    types:
      - spm-staging-e2e

permissions:
  contents: read

concurrency:
  group: test-e2e-${{ github.event.client_payload.check_kind || 'legacy' }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Browser E2E
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      CI: true
      ALLOW_REMOTE_WRITES: true
      SPM_E2E_BACKEND_ROOT: ${{ github.workspace }}/spm/backend
    steps:
      - name: Checkout E2E tests
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout application backend for the log check
        uses: actions/checkout@v4
        with:
          repository: SPM-Specialized-Project/SPM-frontend
          ref: ${{ github.event.client_payload.app_sha || inputs.app_ref || 'staging' }}
          path: spm
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install E2E dependencies and browser
        run: |
          npm ci
          npx playwright install chromium

      - name: Verify target staging URL
        shell: powershell
        env:
          TARGET_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || github.event.client_payload.base_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TARGET_BASE_URL)) {
            throw 'A staging URL is required.'
          fi

          $baseUrl = $env:TARGET_BASE_URL.TrimEnd('/')
          foreach ($endpointPath in @('/api/health', '/login')) {
            $uri = "$baseUrl$endpointPath"
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri $uri -Method Get -TimeoutSec 20 -UseBasicParsing
                if ($response.StatusCode -ge 400) {
                  throw "HTTP $($response.StatusCode)"
                }
                break
              } catch {
                if ($attempt -eq 10) {
                  throw "Staging endpoint did not become healthy: $uri. $($_.Exception.Message)"
                }
                Start-Sleep -Seconds 2
              }
            }
          }

          $environmentUpdates = "BASE_URL=$baseUrl`nAPI_BASE_URL=$baseUrl`n"
          $utf8WithoutBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, $environmentUpdates, $utf8WithoutBom)

      - name: Run Playwright E2E
        run: npm test

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spm-e2e-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            playwright-report
            test-results
