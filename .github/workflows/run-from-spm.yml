name: Run SPM E2E

run-name: SPM E2E ${{ github.event.client_payload.correlation_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public staging URL to test, for example https://example.trycloudflare.com
        required: true
        type: string
      app_ref:
        description: SPM application ref for the isolated backend log check
        default: staging
        required: true
        type: string
  repository_dispatch:
    types:
      - spm-staging-e2e

permissions:
  contents: read

concurrency:
  group: test-e2e-${{ github.event.client_payload.check_kind || 'legacy' }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Full E2E and Unit Tests
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      CI: true
      ALLOW_REMOTE_WRITES: true
      SPM_E2E_BACKEND_ROOT: ${{ github.workspace }}/spm/backend
    steps:
      - name: Checkout E2E tests
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout application backend for the log check
        uses: actions/checkout@v4
        with:
          repository: SPM-Specialized-Project/SPM-frontend
          ref: ${{ github.event.client_payload.app_sha || inputs.app_ref || 'staging' }}
          path: spm
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install E2E dependencies and browser
        run: |
          npm ci
          npx playwright install chromium

      - name: Install frontend native-test dependencies
        run: npm ci --prefix spm/frontend

      - name: Stage Node and Vitest suites
        shell: powershell
        run: .\scripts\stage-native-tests.ps1

      - name: Verify target staging URL
        shell: powershell
        env:
          TARGET_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || github.event.client_payload.base_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TARGET_BASE_URL)) {
            throw 'A staging URL is required.'
          }
          $baseUrl = $env:TARGET_BASE_URL.TrimEnd('/')

          foreach ($route in @('/api/health', '/login')) {
            & curl.exe --fail --silent --show-error --retry 10 --retry-delay 2 --connect-timeout 10 --max-time 30 "$baseUrl$route" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Staging health check failed for $route."
            }
          }

          $environment = "BASE_URL=$baseUrl`nAPI_BASE_URL=$baseUrl`n"
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            $environment,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Run Playwright E2E
        id: playwright
        continue-on-error: true
        run: npm test

      - name: Run frontend Vitest suites
        id: frontend_vitest
        continue-on-error: true
        working-directory: spm/frontend
        run: .\node_modules\.bin\vitest.cmd run tests\run-code-sandbox tests\US-007.2

      - name: Run backend Node test suites
        id: backend_node
        continue-on-error: true
        working-directory: spm
        run: node --test backend/test/us-008.2/us-008.2.spec.ts tests/us-009.1/issue-detection.spec.ts tests/US-012.4/semester-reset.spec.ts

      - name: Run backend Vitest suites
        id: backend_vitest
        continue-on-error: true
        working-directory: spm
        run: .\frontend\node_modules\.bin\vitest.cmd run --root . tests\US-012.2-admin-operations\admin-operations.spec.ts tests\us-012-3\retention-backup.spec.ts

      - name: Summarize full test suite result
        if: always()
        shell: powershell
        env:
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
          FRONTEND_VITEST_OUTCOME: ${{ steps.frontend_vitest.outcome }}
          BACKEND_NODE_OUTCOME: ${{ steps.backend_node.outcome }}
          BACKEND_VITEST_OUTCOME: ${{ steps.backend_vitest.outcome }}
        run: |
          $failed = @()
          foreach ($suite in @(
            @{ Name = 'Playwright E2E'; Outcome = $env:PLAYWRIGHT_OUTCOME },
            @{ Name = 'Frontend Vitest'; Outcome = $env:FRONTEND_VITEST_OUTCOME },
            @{ Name = 'Backend Node'; Outcome = $env:BACKEND_NODE_OUTCOME },
            @{ Name = 'Backend Vitest'; Outcome = $env:BACKEND_VITEST_OUTCOME }
          )) {
            if ($suite.Outcome -ne 'success') { $failed += "$($suite.Name): $($suite.Outcome)" }
          }
          if ($failed.Count -gt 0) {
            throw "One or more full-suite groups failed: $($failed -join '; ')"
          }

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spm-e2e-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            playwright-report
            test-results
