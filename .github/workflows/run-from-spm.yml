name: Run SPM E2E

run-name: SPM E2E ${{ github.event.client_payload.correlation_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public staging URL to test, for example https://example.trycloudflare.com
        required: true
        type: string
  repository_dispatch:
    types:
      - spm-staging-e2e

permissions:
  contents: read

concurrency:
  group: test-e2e-${{ github.event.client_payload.check_kind || 'legacy' }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Browser E2E
    runs-on: [self-hosted, linux, x64, test-e2e-local]
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Checkout E2E tests
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install E2E dependencies and browser
        run: |
          npm ci
          npx playwright install chromium

      - name: Verify target staging URL
        shell: bash
        env:
          TARGET_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || github.event.client_payload.base_url }}
        run: |
          set -euo pipefail

          if [[ -z "${TARGET_BASE_URL:-}" ]]; then
            echo '::error::A staging URL is required.'
            exit 1
          fi

          base_url="${TARGET_BASE_URL%/}"
          curl --fail --silent --show-error --retry 10 --retry-delay 2 \
            "$base_url/api/health" >/dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 2 \
            "$base_url/login" >/dev/null

          echo "BASE_URL=$base_url" >> "$GITHUB_ENV"
          echo "API_BASE_URL=$base_url" >> "$GITHUB_ENV"

      - name: Run Playwright E2E
        run: npm test

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spm-e2e-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            playwright-report
            test-results
